<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Event Map Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<style>
  body { margin: 0; display: flex; height: 100vh; }
  #viewer { flex: 2; }
  #sidebar {
    flex: 1;
    overflow-y: auto;
    border-left: 1px solid #ccc;
    padding: 10px;
    background: #fafafa;
  }
  .booth-item {
    padding: 10px;
    margin-bottom: 10px;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
  }
  .booth-item:hover {
    background: #eef;
  }
  .booth-overlay {
    background-color: rgba(255, 0, 0, 0.3); /* 赤・30%透明 */
    border: 1px solid rgba(255, 0, 0, 0.6); /* 見やすい枠線 */
    cursor: pointer;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="sidebar">
  <h2>Booth List</h2>
  <div id="booth-list"></div>
  <div id="booth-detail"></div>
</div>

<script>
  const viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://ribbit0asis.github.io/test/images/",
    tileSources: "TGS_WEB_MAP_2_edit2_1/TGS_WEB_MAP_2_edit2_1.dzi?v=" + Date.now(),
    gestureSettingsMouse: {
      clickToZoom: false,
      dblClickToZoom: true,
      dragToPan: true,
      scrollToZoom: true
    }
  });

  function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
      }[ch]));
  }

  function isSafeUrl(url) {
      try {
          const u = new URL(url, window.location.href);
          return u.protocol === "http:" || u.protocol === "https:";
      } catch {
          return false;
      }
  }

  function createOverlayButton(boothId) {
      const div = document.createElement("div");
      div.className = "booth-overlay";
      div.dataset.boothId = boothId;

      div.addEventListener("pointerdown", () => {
          const booth = window._booths.find(b => b.id === boothId);
          if (booth) showBoothDetail(booth);
      });
      return div;
  };

  function renderBoothList(booths) {
    const list = document.getElementById("booth-list");
    list.innerHTML = "";

    for (const booth of booths) {
      const item = document.createElement("div");
      item.className = "booth-item";

      item.innerHTML = `
        <strong>${escapeHtml(booth.id)}</strong><br>
        ${escapeHtml(booth.name)}<br>
        <small>${escapeHtml(booth.desc || "")}</small>
      `;

      item.onclick = () => showBoothDetail(booth);

      list.appendChild(item);
    }
  }

  function showBoothDetail(booth) {
    const detail = document.getElementById("booth-detail");

    detail.innerHTML = `
      <h3>${escapeHtml(booth.name)}</h3>
      <p>${escapeHtml(booth.desc || "")}</p>
      ${booth.url && isSafeUrl(booth.url) ? `<a href="${escapeHtml(booth.url)}" target="_blank" rel="noopener noreferrer">公式サイト</a>` : ""}
    `;
  }

  fetch("https://ribbit0asis.github.io/test/json/booths.json?v=" + Date.now())
    .then(r => r.json())
    .then(booths => {
      window._booths = booths;  // OpenSeadragon連動用
      renderBoothList(booths);  // ★右側 UI を描画
      viewer.addHandler("tile-loaded", () => {
        if (window._overlayInitialized) return;
        window._overlayInitialized = true;

        const img = viewer.world.getItemAt(0);
        const imageWidth = img.getContentSize().x;
        const imageHeight = img.getContentSize().y;

        for (const booth of booths) {
          const rect = new OpenSeadragon.Rect(
            booth.x / imageWidth,
            booth.y / imageHeight,
            booth.w / imageWidth,
            booth.h / imageHeight
          );

          viewer.addOverlay({
            element: createOverlayButton(booth.id),
            location: rect
          });
        }
      });
  });

  viewer.addHandler("canvas-click", function(event) {
    const webPoint = event.position;
    const viewportPoint = viewer.viewport.pointFromPixel(webPoint);
    const imagePoint = viewer.viewport.viewportToImageCoordinates(viewportPoint);

    const x_px = Math.round(imagePoint.x);
    const y_px = Math.round(imagePoint.y);

    console.log("クリック位置(px):", x_px, y_px);

  });

</script>
</body>
</html>
