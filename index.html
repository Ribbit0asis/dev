<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Event Map Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<style>
  body { margin: 0; }
  #viewer { width: 100vw; height: 100vh; }
  .booth-overlay {
    background-color: rgba(255, 0, 0, 0.3); /* 赤・30%透明 */
    border: 1px solid rgba(255, 0, 0, 0.6); /* 見やすい枠線 */
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="viewer"></div>

<script>
  const viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://ribbit0asis.github.io/test/images/",
    tileSources: "TGS_WEB_MAP_2_edit2_1/TGS_WEB_MAP_2_edit2_1.dzi?v=" + Date.now()
  });

  function sendBoothMessage(boothId) {
      window.parent.postMessage(
          { boothId: boothId },
          "*"
      );
  };

  function createOverlayButton(boothId) {
      const div = document.createElement("div");
      div.className = "booth-overlay";
      div.dataset.boothId = boothId;

      div.onclick = () => sendBoothMessage(boothId);

      return div;
  };

  fetch("https://ribbit0asis.github.io/test/json/booths.json?v=" + Date.now())
    .then(r => r.json())
    .then(booths => {
    viewer.addHandler("tile-loaded", () => {
      if (window._overlayInitialized) return;
      window._overlayInitialized = true;

      const img = viewer.world.getItemAt(0);
      const imageWidth = img.getContentSize().x;
      const imageHeight = img.getContentSize().y;

      for (const booth of booths) {
        const rect = new OpenSeadragon.Rect(
          booth.x / imageWidth,
          booth.y / imageHeight,
          booth.w / imageWidth,
          booth.h / imageHeight
        );

        viewer.addOverlay({
          element: createOverlayButton(booth.id),
          location: rect
        });
      }
    });
  });

  viewer.addHandler("canvas-click", function(event) {
    // ① 画面上のクリック位置（ブラウザ px）
    const webPoint = event.position;

    // ② viewport 座標に変換
    const viewportPoint = viewer.viewport.pointFromPixel(webPoint);

    // ③ 現在のズーム倍率を取得
    const zoom = viewer.viewport.getZoom(true); // true = current zoom

    // ④ 元画像のサイズ（px）
    const img = viewer.world.getItemAt(0);
    const imageWidth = img.getContentSize().x;
    const imageHeight = img.getContentSize().y;

    // ⑤ viewport 座標 → 元画像 px に変換（ズレない方法）
    const x_px = Math.round(viewportPoint.x * imageWidth * zoom);
    const y_px = Math.round(viewportPoint.y * imageHeight * zoom);

    console.log("クリック位置(px):", x_px, y_px);

    // ⑥ 仮 overlay のサイズ
    const tempW = 100;
    const tempH = 100;

    // ⑦ px → 割合に変換
    const rect = new OpenSeadragon.Rect(
      x_px / imageWidth,
      y_px / imageHeight,
      tempW / imageWidth,
      tempH / imageHeight
    );

    // ⑧ 仮 overlay を作成
    const tempDiv = document.createElement("div");
    tempDiv.className = "booth-overlay";
    tempDiv.style.backgroundColor = "rgba(0, 150, 255, 0.3)";
    tempDiv.style.border = "2px solid rgba(0, 150, 255, 0.8)";

    viewer.addOverlay({
      element: tempDiv,
      location: rect
    });
  });

</script>
</body>
</html>
