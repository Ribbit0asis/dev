<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Event Map Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<style>
  body { margin: 0; }
  #viewer { width: 100vw; height: 100vh; }
  .booth-overlay {
    background-color: rgba(255, 0, 0, 0.3); /* 赤・30%透明 */
    border: 1px solid rgba(255, 0, 0, 0.6); /* 見やすい枠線 */
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="viewer"></div>

<script>
  const viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://ribbit0asis.github.io/test/images/",
    tileSources: "TGS_WEB_MAP_2_edit2_1/TGS_WEB_MAP_2_edit2_1.dzi"
  });

  function sendBoothMessage(boothId) {
      window.parent.postMessage(
          { boothId: boothId },
          "*"
      );
  };

  function createOverlayButton(boothId) {
      const div = document.createElement("div");
      div.className = "booth-overlay";
      div.dataset.boothId = boothId;

      div.onclick = () => sendBoothMessage(boothId);

      return div;
  };

  fetch("https://ribbit0asis.github.io/test/json/booths.json")
    .then(r => r.json())
    .then(booths => {
    viewer.addHandler("open", () => {
      const img = viewer.world.getItemAt(0);
      const imageWidth = img.getContentSize().x;
      const imageHeight = img.getContentSize().y;

      for (const booth of booths) {

        const rect = new OpenSeadragon.Rect(
          booth.x / imageWidth,
          booth.y / imageHeight,
          booth.w / imageWidth,
          booth.h / imageHeight
        );

        viewer.addOverlay({
          element: createOverlayButton(booth.id),
          location: rect
        });
      }
    });
  });

viewer.addHandler("canvas-click", function(event) {

  const webPoint = event.position;
  const viewportPoint = viewer.viewport.pointFromPixel(webPoint);

  const zoom = viewer.viewport.getZoom(true);

  const img = viewer.world.getItemAt(0);
  const imageWidth = img.getContentSize().x;
  const imageHeight = img.getContentSize().y;

  // 元画像の px（ズレない計算）
  let x_px = Math.round(viewportPoint.x * imageWidth * zoom);
  let y_px = Math.round(viewportPoint.y * imageHeight * zoom);

  const tempW = 100;
  const tempH = 100;

  // 初期位置の Rect
  let rect = new OpenSeadragon.Rect(
    x_px / imageWidth,
    y_px / imageHeight,
    tempW / imageWidth,
    tempH / imageHeight
  );

  // overlay 要素
  const tempDiv = document.createElement("div");
  tempDiv.className = "booth-overlay";
  tempDiv.style.backgroundColor = "rgba(0, 150, 255, 0.3)";
  tempDiv.style.border = "2px solid rgba(0, 150, 255, 0.8)";
  tempDiv.style.position = "absolute"; // 重要：ドラッグ可能にする

  viewer.addOverlay({
    element: tempDiv,
    location: rect
  });

  // -----------------------------
  // ★ ドラッグ処理を追加
  // -----------------------------
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  tempDiv.addEventListener("mousedown", function(e) {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    e.preventDefault();
  });

  document.addEventListener("mousemove", function(e) {
    if (!isDragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    startX = e.clientX;
    startY = e.clientY;

    // dx, dy は画面上の px → viewport → image(px) に変換
    const viewportDelta = viewer.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx, dy));
    const imageDelta = viewer.viewport.viewportToImageCoordinates(viewportDelta);

    // 元画像の px を更新
    x_px += imageDelta.x * zoom;
    y_px += imageDelta.y * zoom;

    // Rect を更新
    rect = new OpenSeadragon.Rect(
      x_px / imageWidth,
      y_px / imageHeight,
      tempW / imageWidth,
      tempH / imageHeight
    );

    viewer.updateOverlay(tempDiv, rect);
  });

  document.addEventListener("mouseup", function() {
    if (!isDragging) return;
    isDragging = false;

    console.log("ドラッグ後の位置(px):", Math.round(x_px), Math.round(y_px));
  });

});


</script>
</body>
</html>
